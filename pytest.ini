[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
    # Velocidad: en local usa  pytest -n auto  (paralelo, requiere pytest-xdist)
    # Cobertura solo cuando haga falta:  pytest --cov=app  (añade ~3–5 s)
markers =
    unit: tests unitarios sin dependencias externas
    integration: tests con BD o HTTP

# Estructura de tests:
#   tests/helpers.py          — payloads compartidos (booking, service, review, contact)
#   tests/integration/api/    — contratos HTTP por router (fuente de verdad API)
#   tests/integration/repositories/ — persistencia SQLAlchemy
#   tests/unit/domain/        — entidades y casos de uso (mocks)
#   tests/unit/infrastructure/ — adaptadores (notifiers, etc.)

# Variables inyectadas por pytest-env ANTES de cargar conftest (plugin: pytest-env).
# NO usar estos valores en producción. Requiere: pip install pytest-env
env =
    SECRET_KEY=bulls-barber-test-only-secret-key-do-not-use-in-production
    DEBUG=true
    RATE_LIMIT_ENABLED=false

# ── Guardia anti-legacy ───────────────────────────────────────────────────────
# Si estas carpetas reaparecen en el repo, el test de guardia falla antes de
# llegar a la suite completa. Ver tests/test_no_legacy.py
