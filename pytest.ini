[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
markers =
    unit: tests unitarios sin dependencias externas
    integration: tests con BD o HTTP

# ── Variables de entorno para tests ──────────────────────────────────────────
# Estas variables se inyectan ANTES de que se carguen los módulos de la app.
# NO usar estos valores en producción.
[pytest:env]
SECRET_KEY=bulls-barber-test-only-secret-key-do-not-use-in-production
DEBUG=true
RATE_LIMIT_ENABLED=false

# ── Guardia anti-legacy ───────────────────────────────────────────────────────
# Si estas carpetas reaparecen en el repo, el test de guardia falla antes de
# llegar a la suite completa. Ver tests/test_no_legacy.py
