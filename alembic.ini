# ──────────────────────────────────────────────────────────────────────────────
# alembic.ini — Configuración de Alembic para Bulls Barber Shop
#
# IMPORTANTE: sqlalchemy.url NO se define aquí; se sobreescribe dinámicamente
# en alembic/env.py leyendo app.config.settings.DATABASE_URL.  De este modo
# el mismo alembic.ini funciona tanto en dev (SQLite) como en prod (PostgreSQL)
# sin tocar este fichero.
# ──────────────────────────────────────────────────────────────────────────────

[alembic]
# Carpeta donde viven env.py, script.py.mako y versions/
script_location = alembic

# Añade el directorio raíz (backend/) al sys.path para poder importar app.*
prepend_sys_path = .

# Separador de listas de rutas (prepend_sys_path, version_locations). Requerido desde Alembic 1.16+.
path_separator = os

# La URL real se inyecta en env.py; esta línea es solo un placeholder
# para que la CLI de Alembic no se queje si se invoca sin env.py.
# sqlalchemy.url = sqlite:///./bulls_barbershop.db


# ── Logging ───────────────────────────────────────────────────────────────────

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
